<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coordinate Scrambler System</title>
    <script src="function.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>Coordinate Scrambler</h2>
    
    <!-- Form triggers handleScramble on submission -->
    <form id="scrambleForm">
        <div class="form-group">
            <label for="address">Target Address</label>
            <input type="text" id="address" placeholder="Enter address" required>
        </div>
        <button type="submit" class="btn-private" onclick="handleScramble(event)">Private Masking</button>
    </form>

<!-- UI container for JavaScript state messages and final template output -->
<!-- Isolated status text placeholder -->
    <div id="statusMessage" class="status-msg"></div>
<!-- Permanent structural display card template -->
 <div id="resultCard" class="card-result"> 
    <h3 id="cardTitle">Coordinate Output</h3>
    <p><strong>Address:</strong> <span id="outAddress"></span></p>
    <hr>
    <p><strong>Latitude:</strong> <span id="outLat"></span></p>
    <p><strong>Longitude:</strong> <span id="outLong"></span></p>
    <p><strong>Altitude:</strong> <span id="outAlt"></span> m</p>
</div>
</div>

</body>
</html>
